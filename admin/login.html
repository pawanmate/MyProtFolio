<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Pawan Mate Portfolio CMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <style>
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .login-card {
      background: var(--bg-surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 40px;
      width: min(440px, 100%);
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.6), 0 0 40px rgba(67, 199, 238, 0.08);
      position: relative;
    }
    .login-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent-cyan));
    }
    .login-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .login-brand {
      font-family: var(--font-heading);
      font-size: 24px;
      font-weight: 700;
      color: var(--text);
    }
    .login-brand span { color: var(--accent); }
    .login-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 6px;
    }
    .alert-box {
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      margin-bottom: 18px;
      display: none;
    }
    .alert-box.error {
      display: block;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }
    .alert-box.info {
      display: block;
      background: rgba(67, 199, 238, 0.12);
      border: 1px solid rgba(67, 199, 238, 0.25);
      color: #b8ecf8;
    }
    .config-drawer {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px dashed var(--line);
    }
    .config-toggle {
      font-size: 12px;
      color: var(--accent-cyan);
      background: none;
      border: none;
      cursor: pointer;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 0 auto;
    }
    .config-body {
      margin-top: 14px;
      display: none;
    }
    .config-body.show {
      display: block;
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-header">
        <div class="login-brand">PAWAN<span>.</span> CMS</div>
        <p class="login-subtitle">Secure Civil Engineering Portfolio Dashboard</p>
      </div>

      <div id="loginAlert" class="alert-box"></div>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="loginEmail">Administrator Email</label>
          <input type="email" id="loginEmail" class="form-control" placeholder="admin@example.com" required autocomplete="email">
        </div>

        <div class="form-group" style="margin-bottom: 24px;">
          <label class="form-label" for="loginPassword">Password</label>
          <input type="password" id="loginPassword" class="form-control" placeholder="••••••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" id="loginBtn" class="btn btn-primary" style="width: 100%; padding: 12px;">
          Sign In to Dashboard
        </button>
      </form>

      <div class="config-drawer">
        <button type="button" class="config-toggle" id="toggleConfigBtn">
          ⚙ Database Connection Settings
        </button>
        <div class="config-body" id="configBody">
          <p style="font-size: 11px; color: var(--text-muted); margin-bottom: 10px;">
            If environment variables are not yet set in Vercel, paste your Supabase credentials here to connect immediately:
          </p>
          <div class="form-group">
            <label class="form-label" for="cfgUrl">Supabase Project URL</label>
            <input type="url" id="cfgUrl" class="form-control" placeholder="https://your-project.supabase.co">
          </div>
          <div class="form-group">
            <label class="form-label" for="cfgAnonKey">Supabase Anon Key</label>
            <input type="text" id="cfgAnonKey" class="form-control" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6...">
          </div>
          <button type="button" id="saveCfgBtn" class="btn btn-sm btn-cyan" style="width: 100%;">
            Save Database Settings
          </button>
        </div>
      </div>

      <div style="margin-top: 24px; text-align: center;">
        <a href="/" style="font-size: 12px; color: var(--text-muted); text-decoration: none;">
          ← Return to Public Portfolio
        </a>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const cfg = SupabaseService.getConfig();
      const cfgUrlInput = document.getElementById('cfgUrl');
      const cfgKeyInput = document.getElementById('cfgAnonKey');
      if (cfg.url) cfgUrlInput.value = cfg.url;
      if (cfg.anonKey) cfgKeyInput.value = cfg.anonKey;

      // Check if user is already logged in
      const user = await SupabaseService.getUser();
      if (user) {
        window.location.href = '/admin';
        return;
      }

      // Drawer toggle
      const toggleBtn = document.getElementById('toggleConfigBtn');
      const configBody = document.getElementById('configBody');
      toggleBtn.addEventListener('click', () => {
        configBody.classList.toggle('show');
      });

      // Save Config button
      document.getElementById('saveCfgBtn').addEventListener('click', () => {
        const url = cfgUrlInput.value.trim();
        const key = cfgKeyInput.value.trim();
        if (!url || !key) {
          showAlert('Please enter both Supabase URL and Anon Key.', 'error');
          return;
        }
        SupabaseService.saveConfig(url, key);
        showAlert('Database settings saved! You can now log in.', 'info');
        configBody.classList.remove('show');
      });

      // Login form submission
      const form = document.getElementById('loginForm');
      const loginBtn = document.getElementById('loginBtn');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;

        loginBtn.disabled = true;
        loginBtn.textContent = 'Authenticating...';
        hideAlert();

        try {
          await SupabaseService.login(email, password);
          loginBtn.textContent = 'Success! Redirecting...';
          window.location.href = '/admin';
        } catch (err) {
          showAlert(err.message || 'Login failed. Please check your credentials.', 'error');
          loginBtn.disabled = false;
          loginBtn.textContent = 'Sign In to Dashboard';
        }
      });

      function showAlert(msg, type = 'error') {
        const alertBox = document.getElementById('loginAlert');
        alertBox.textContent = msg;
        alertBox.className = 'alert-box ' + type;
      }

      function hideAlert() {
        const alertBox = document.getElementById('loginAlert');
        alertBox.className = 'alert-box';
        alertBox.style.display = 'none';
      }
    });
  </script>
</body>
</html>
